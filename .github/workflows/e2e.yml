name: End-to-end tests

# The real app against a fresh PostgreSQL, driven in Chromium with a visible window (headed, under a virtual
# display). The screenshots each test takes are committed to the pull request's branch (e2e/screenshots/), so they
# can be reviewed there and are kept in git. Only branches of this repository: the job pushes to the branch.
#
# Everything here is a throwaway test setup: the database lives only for this job, and the passwords and key below
# are test values, not real ones.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ba
          POSTGRES_PASSWORD: ba-e2e-only
          POSTGRES_DB: ba_tracker
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ba -d ba_tracker"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ba:ba-e2e-only@localhost:5432/ba_tracker
      TENANT_INTEGRATION_MASTER_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      INTERNAL_ADMIN_BOOTSTRAP_PASSWORD: e2e-internal-admin-only
      BXI_CORE_BOOTSTRAP_PASSWORD: e2e-bxi-core-admin-only
      APP_BASE_URL: http://localhost:5173
      PORT: '5173'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          # The branch itself (not the merge commit), so the screenshots can be pushed back to it.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the database
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f database/schema.sql
      - run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (headed)
        run: xvfb-run -a npx playwright test --headed --repeat-each=3
      - name: Show what the page looked like when a test failed
        if: failure()
        run: |
          for file in test-results/*/error-context.md; do
            [ -f "$file" ] || continue
            echo "::group::$file"
            cat "$file"
            echo "::endgroup::"
          done
      - name: Keep the report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            playwright-report/
            test-results/
            e2e/screenshots/
          retention-days: 14
      - name: Commit the screenshots to the branch
        if: success() && false
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/screenshots
          if git diff --cached --quiet; then
            echo 'The screenshots did not change.'
            exit 0
          fi
          # [skip ci]: this commit only adds screenshots, so it doesn't start the workflows again.
          git commit --quiet -m "E2E screenshots (run ${{ github.run_number }}) [skip ci]"
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:$BRANCH"; then
              echo "Screenshots committed to $BRANCH."
              exit 0
            fi
            git pull --rebase --quiet origin "$BRANCH"
          done
          echo 'Could not push the screenshots; they are in the e2e-report artifact.'
          exit 1
