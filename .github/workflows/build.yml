name: Build

# Runs once per change: on pull requests, and on main after a merge. A push to a branch with an open pull request runs
# only through the pull request (not twice), and a newer push cancels the run it replaces.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job: one install, and one billed minute rounded up instead of two.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Formatting and lint errors fail the build; warnings are listed in the run's annotations.
      - name: Format diff (temporary)
        run: |
          npx biome format --write server/integrations/communications.ts server/integrations/git-mapping-rules.ts server/integrations/git-mappings.ts server/integrations/gitlab.ts server/trackers/tracker-core.ts server/trackers/tracker-routes.ts server/trackers/tracker-source-routes.ts server/trackers/tracker-templates.ts src/app/App.tsx src/features/integrations/RepositoryMappingSettings.tsx src/features/settings/Settings.tsx src/features/trackers/GitTemplateRules.tsx src/features/trackers/TemplateManager.tsx src/features/trackers/TrackerCollection.tsx src/features/trackers/TrackerDetailsDialog.tsx src/features/trackers/TrackerScreen.tsx src/features/trackers/Trackers.tsx src/features/trackers/gitGeneration.ts src/features/trackers/gitStarter.ts src/features/trackers/stepTasks.ts src/features/trackers/trackerApi.ts src/features/trackers/trackerModel.ts src/features/trackers/trackerTemplates.ts src/features/trackers/trackers.css src/styles/app/account-settings.css tests/git-tracker-setup.test.ts tests/tracker-templates.test.ts  || true
          git diff > format.diff || true
          echo "FORMAT-DIFF-START"
          base64 -w0 format.diff
          echo
          echo "FORMAT-DIFF-END"
          git checkout -- .
      - name: Biome check
        run: |
          set +e
          npx biome ci . --reporter=json --max-diagnostics=none > biome.json.out
          status=$?
          node scripts/lint-summary.mjs biome.json.out
          exit $status
      # Authentication and access-control tests. These must pass.
      - name: Authentication and session tests
        if: ${{ !cancelled() }}
        run: npm run test:auth-hardening
      # Deploy caching: index.html revalidates, missing assets 404 instead of returning HTML.
      - name: Static site caching tests
        if: ${{ !cancelled() }}
        run: npm run test:static-site
      # The whole suite must pass. Each failing test is annotated on the run page with its error.
      - name: Full test suite
        if: ${{ !cancelled() }}
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          tail -n 40 test-output.txt
          node scripts/test-summary.mjs test-output.txt
          exit $status
