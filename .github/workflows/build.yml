name: Build

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Authentication and access-control tests. These must pass.
      - name: Authentication and session tests
        run: npm run test:auth-hardening
      # Deploy caching: index.html revalidates, missing assets 404 instead of returning HTML.
      - name: Static site caching tests
        run: npm run test:static-site
      # The whole suite had not been run automatically before this job existed, and some older tests may be
      # out of date. Failures are reported but do not block the build. Remove continue-on-error once it is green.
      - name: Full test suite
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          tail -n 40 test-output.txt
          node scripts/test-summary.mjs test-output.txt
          exit $status
        continue-on-error: true
