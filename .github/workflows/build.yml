name: Build

# Runs once per change: on pull requests, and on main after a merge. A push to a branch with an open pull request runs
# only through the pull request (not twice), and a newer push cancels the run it replaces.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # One job: one install, and one billed minute rounded up instead of two.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Format diff (temporary)
        run: |
          npx biome format --write scripts/compress-dist.mjs server/index.ts server/platform/compression.ts server/platform/static-site.ts server/services/workspace-version.ts server/workspace/store-routes.ts src/app/App.tsx src/app/PageLoading.tsx src/app/lazyPage.ts src/app/state/useAccountAndRoutes.ts src/features/accounts/AccountUsers.tsx src/features/action-center/ActionCenterPage.tsx src/features/action-center/ActionCenterReports.tsx src/features/action-center/ActionCenterWidgets.tsx src/features/admin/PlatformAiAgents.tsx src/features/ai/statusReport.ts src/features/settings/PlatformSettings.tsx src/features/settings/Settings.tsx src/features/settings/settingsRequest.ts src/features/tasks/TaskBoard.tsx src/features/tasks/TaskEffort.tsx src/features/trackers/trackerReminders.ts src/features/trackers/trackerUi.tsx src/shared/businessDate.ts src/shared/dates.ts src/shared/intlFormat.ts tests/functional-routes.ts tests/performance.test.ts tests/static-site.test.ts  || true
          git diff > format.diff || true
          echo "FORMAT-DIFF-START"
          base64 -w0 format.diff
          echo
          echo "FORMAT-DIFF-END"
          git checkout -- .
      - name: Bundle sizes (temporary)
        run: |
          npx vite build --logLevel warn >/dev/null 2>&1 || true
          node scripts/compress-dist.mjs || true
          echo "BUNDLE-START"; ls -lS dist/assets | head -25; echo "BUNDLE-END"
          rm -rf dist
      - run: npm run build
      # Formatting and lint errors fail the build; warnings are listed in the run's annotations.
      - name: Biome check
        run: |
          set +e
          npx biome ci . --reporter=json --max-diagnostics=none > biome.json.out
          status=$?
          node scripts/lint-summary.mjs biome.json.out
          exit $status
      # Authentication and access-control tests. These must pass.
      - name: Authentication and session tests
        if: ${{ !cancelled() }}
        run: npm run test:auth-hardening
      # Deploy caching: index.html revalidates, missing assets 404 instead of returning HTML.
      - name: Static site caching tests
        if: ${{ !cancelled() }}
        run: npm run test:static-site
      # The whole suite must pass. Each failing test is annotated on the run page with its error.
      - name: Full test suite
        if: ${{ !cancelled() }}
        run: |
          set +e
          npm test > test-output.txt 2>&1
          status=$?
          tail -n 40 test-output.txt
          node scripts/test-summary.mjs test-output.txt
          exit $status
